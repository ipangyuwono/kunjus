<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Kata Sandi - Kas Kunjungan Industri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="./logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    :focus-visible { outline: 2px solid #4f46e5; outline-offset: 2px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
      <div class="text-center mb-5">
        <p class="font-extrabold text-slate-900 text-lg">Lupa Kata <span class="font-medium text-slate-400">Sandi</span></p>
        <p class="text-xs text-slate-500 mt-1">Pembayaran Kunjungan Industri</p>
      </div>

      <div class="bg-white border border-slate-200 rounded-xl p-6" style="box-shadow: 0 1px 2px rgba(15,23,42,.06);">
        <h1 class="text-base font-bold text-slate-900 text-center">Reset kata sandi</h1>
        <p class="text-xs text-slate-500 mt-1 mb-5 text-center">Masukkan email akun, tautan reset akan dikirim ke email tersebut.</p>

        <form id="formForgot" class="space-y-4">
          <div>
            <label for="inputEmail" class="block text-xs font-semibold text-slate-700 mb-1.5">Email</label>
            <input type="email" id="inputEmail" class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:outline-none focus:border-indigo-600" placeholder="nama@sekolah.id" required>
          </div>

          <p id="formMsg" class="text-xs hidden py-2.5 px-3 rounded-lg border"></p>

          <button type="submit" id="btnKirim" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-semibold text-sm transition flex items-center justify-center gap-2 min-h-[44px] disabled:opacity-60 disabled:cursor-not-allowed">
            <i class="fa-solid fa-paper-plane text-xs"></i>
            <span>Kirim tautan reset</span>
          </button>
        </form>

        <div class="mt-4 pt-4 border-t border-slate-100 text-center">
          <a href="./index.html" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition"><i class="fa-solid fa-arrow-left mr-1.5 text-[11px]"></i>Kembali ke halaman masuk</a>
        </div>
      </div>

      <p class="text-center text-[11px] text-slate-400 mt-4">Tautan hanya berlaku 10 menit. Masih gagal? Tanya admin yang memegang data login.</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('formForgot');
    const btn = document.getElementById('btnKirim');
    const msg = document.getElementById('formMsg');

    function showMsg(text, type) {
      msg.classList.remove('hidden', 'bg-rose-50', 'border-rose-200', 'text-rose-700', 'bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
      if (type === 'success') {
        msg.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
      } else {
        msg.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-700');
      }
      msg.innerText = text;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('inputEmail').value.trim();
      if (!email) return;

      btn.disabled = true;
      btn.innerHTML = '<span>Mengirim...</span>';
      msg.classList.add('hidden');

      try {
        const res = await fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const raw = await res.text();
        let data = {};
        try { data = raw ? JSON.parse(raw) : {}; } catch { data = { _raw: raw }; }
        if (res.ok) {
          showMsg(data.message || 'Jika email terdaftar, instruksi reset password telah dikirim.', 'success');
          form.reset();
        } else {
          console.error('forgot-password gagal:', res.status, raw);
          showMsg(`Gagal (${res.status}): ${data.error || data.message || raw.slice(0, 200) || 'Coba lagi.'}`, 'error');
        }
      } catch (err) {
        console.error('fetch error:', err);
        showMsg('Tidak bisa menghubungi server. Pastikan buka via http://localhost:3000 (node server.js), bukan file:// / Live Server.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane text-xs"></i><span>Kirim tautan reset</span>';
      }
    });
  </script>
</body>
</html>
